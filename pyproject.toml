[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "transiograms"
description = "Markov models of geological categories: Markov chains, hidden and semi-Markov models, transiograms and categorical grid simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.txt"]
authors = [{ name = "Gustavo Pretto Scholze" }]
keywords = ["geostatistics", "markov chain", "hidden markov model", "transiogram", "t-progs", "geology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]
dynamic = ["version"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
all = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://cratongen.github.io/transiograms/"
Documentation = "https://cratongen.github.io/transiograms/"
Repository = "https://github.com/cratongen/transiograms"
Issues = "https://github.com/cratongen/transiograms/issues"
Changelog = "https://github.com/cratongen/transiograms/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "maturin>=1.10,<2",
    "pytest>=8",
    "ruff>=0.6",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gallery",
]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
module-name = "transiograms._transiograms"
python-source = "python"
locked = true

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 110
