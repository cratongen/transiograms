site_name: transiograms
site_description: Markov chains, hidden and semi-Markov models, transiograms and categorical simulation for geological facies.
site_url: https://cratongen.github.io/transiograms/
repo_url: https://github.com/cratongen/transiograms
repo_name: cratongen/transiograms
edit_uri: ""

copyright: Copyright 2026 the transiograms authors. MIT OR Apache-2.0.

theme:
  name: material
  logo: brand/mark-black.svg
  favicon: brand/favicon.svg
  # Geist and Geist Mono come from docs/brand/fonts through docs/stylesheets/transiograms.css.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - stylesheets/transiograms.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

hooks:
  - docs/hooks.py
exclude_docs: |
  hooks.py
  griffe_runtime_docs.py
  __pycache__/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            extensions:
              - docs/griffe_runtime_docs.py:RuntimeDocstrings
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            filters: ["!^_"]
            inherited_members: false
            show_symbol_type_heading: true
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false

nav:
  - Home: index.md
  - Install: install.md
  - Guide:
      - Markov chains: guide/markov-chains.md
      - Hidden Markov models: guide/hidden-markov.md
      - Semi-Markov models and selection: guide/semi-markov.md
      - Transiograms: guide/transiograms.md
      - T-PROGS simulation: guide/tp-simulation.md
      - MCP and MCRF: guide/mcrf-mcp.md
      - Working with boitata: guide/boitata.md
  - Examples:
      - Embedded chains: examples/01-markov-chains/01-embedded-chains/README.md
      - Tests and simulation: examples/01-markov-chains/02-tests-and-simulation/README.md
      - Electrofacies: examples/02-hidden-markov/01-electrofacies/README.md
      - Counts and mixtures: examples/02-hidden-markov/02-counts-and-mixtures/README.md
      - Durations and selection: examples/03-semi-markov-and-selection/01-durations-and-selection/README.md
      - Duration laws: examples/03-semi-markov-and-selection/02-duration-laws/README.md
      - Transiograms: examples/04-transiograms/01-transiograms/README.md
      - Entrywise and closeness: examples/04-transiograms/02-entrywise-and-closeness/README.md
      - T-PROGS: examples/05-tp-simulation/01-tprogs/README.md
      - MCP and MCRF: examples/06-mcrf-mcp/01-mcp-and-mcrf/README.md
      - boitata integration: examples/07-boitata-integration/01-drillholes-to-grid/README.md
  - API reference:
      - Core: api/core.md
      - Chain: api/chain.md
      - HMM: api/hmm.md
      - HSMM: api/hsmm.md
      - Transiograms: api/transiogram.md
      - TP simulation: api/tpsim.md
      - MCRF and MCP: api/mcrf.md
      - boitata integration: api/integration.md
      - Plots, datasets, checks: api/extras.md
  - Design notes:
      - Status and limits: status.md
      - Contract: design/spec.md
      - Core: design/core.md
      - Chain: design/chain.md
      - HMM: design/hmm.md
      - HSMM: design/hsmm.md
      - Transiograms: design/transiogram.md
      - TP simulation: design/tpsim.md
      - MCRF and MCP: design/mcrf.md
  - Changelog: changelog.md
  - Contributing:
      - How to contribute: contributing.md
      - Release checklist: release-checklist.md
      - Brand: brand.md
