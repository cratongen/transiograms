name: Documentation
description: Report a wrong, unclear or missing part of the docs or an example.
title: "DOC: <short title>"
labels: [documentation]

body:
- type: input
  attributes:
    label: "Page"
    description: The URL or file of the page.
  validations:
    required: true

- type: textarea
  attributes:
    label: "What is wrong or missing"
  validations:
    required: true
