# On a v* tag: build the sdist and one abi3 wheel (cp311-abi3) per platform, test every wheel in
# a clean environment, then publish to PyPI with Trusted Publishing (environment `pypi`, no
# token). A manual run builds and tests only. docs/install-and-release.md has the procedure.
#
# A platform is published only if it is built and tested here: the `platform` names in `wheels`
# equal those of `test-linux` plus `test-other`, the targets equal RELEASE_TARGETS in
# python/tests/test_packaging.py and the targets of about.toml, and the tests check this file.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  sdist:
    if: github.repository == 'cratongen/transiograms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    if: github.repository == 'cratongen/transiograms'
    name: wheel ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: manylinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { platform: manylinux-aarch64, runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { platform: musllinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, extra: --zig }
          - { platform: musllinux-aarch64, runner: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, extra: --zig }
          - { platform: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: auto }
          - { platform: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, manylinux: auto }
          - { platform: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc, manylinux: auto }
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'aarch64-apple-darwin' && '11.0' || '10.15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os != 'Linux' || matrix.extra
        with:
          python-version: "3.13"
      # The musl wheels are linked by zig on the runner: the musl container's gcc makes the
      # extension need libgcc_s, which auditwheel then copies into the wheel as a sidecar library.
      # Rust links statically into the extension; maturin's auditwheel check fails the build if a
      # Linux wheel would need a library outside the policy.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --strip --out dist ${{ matrix.extra }}
      - name: One abi3 wheel, no sidecar library
        shell: bash
        run: |
          ls -l dist
          whl=(dist/*.whl); [ "${#whl[@]}" -eq 1 ]
          case "${whl[0]}" in *-cp311-abi3-*) ;; *) echo "::error::not a cp311-abi3 wheel"; exit 1 ;; esac
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" -m zipfile -l "${whl[0]}" | tee contents.txt
          if grep -E '\.libs/|\.dylibs/|\.dll\b' contents.txt; then
            echo "::error::the wheel carries a sidecar library"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  # Linux wheels run in the official python images: slim (glibc) and alpine (musl). aarch64 runs
  # on an arm64 runner and covers the floor, the development Python and the newest only.
  test-linux:
    if: github.repository == 'cratongen/transiograms'
    name: test ${{ matrix.platform }} py${{ matrix.python }}
    needs: wheels
    runs-on: ${{ endsWith(matrix.platform, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [manylinux-x86_64, manylinux-aarch64, musllinux-x86_64, musllinux-aarch64]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          - { platform: manylinux-aarch64, python: "3.12" }
          - { platform: manylinux-aarch64, python: "3.14" }
          - { platform: musllinux-aarch64, python: "3.12" }
          - { platform: musllinux-aarch64, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist
      - name: pytest against the installed wheel
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            manylinux-x86_64)  arch=linux/amd64 image=python:${{ matrix.python }}-slim ;;
            manylinux-aarch64) arch=linux/arm64 image=python:${{ matrix.python }}-slim ;;
            musllinux-x86_64)  arch=linux/amd64 image=python:${{ matrix.python }}-alpine ;;
            musllinux-aarch64) arch=linux/arm64 image=python:${{ matrix.python }}-alpine ;;
          esac
          # matplotlib publishes no musllinux aarch64 wheel, so that platform runs without it and
          # without the three test files that import it (the plots and the documented code).
          plot=matplotlib skip=
          if [ "${{ matrix.platform }}" = musllinux-aarch64 ]; then
            plot=
            for f in test_plot test_docstrings test_docs; do skip="$skip --ignore=/src/python/tests/$f.py"; done
          fi
          docker run --rm --platform "$arch" -v "$PWD:/src" -w /src -e PLOT="$plot" -e SKIP="$skip" "$image" sh -ec '
            python -m pip install -q --only-binary=:all: dist/transiograms-*.whl pytest scipy $PLOT
            python -c "import sys, transiograms; print(sys.version, sys.platform, transiograms.__file__)"
            cd /tmp && python -m pytest -q -p no:cacheprovider --rootdir=/src $SKIP /src/python/tests
          '

  # macOS and Windows: the floor, the development Python and the newest, each in a uv-managed
  # CPython.
  test-other:
    if: github.repository == 'cratongen/transiograms'
    name: test ${{ matrix.platform }} py${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-x86_64, macos-arm64, windows-x64]
        python: ["3.11", "3.13", "3.15"]
        include:
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: windows-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pytest against the installed wheel
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} --managed-python "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/venv/Scripts/python.exe"; else py="$RUNNER_TEMP/venv/bin/python"; fi
          uv pip install --python "$py" --only-binary=:all: dist/transiograms-*.whl pytest scipy matplotlib
          "$py" -c "import sys, transiograms; print(sys.version, sys.platform, transiograms.__file__)"
          cd "$RUNNER_TEMP"
          # The licence-list test runs `cargo tree --offline`; these runners have cargo but no
          # downloaded registry. It checks the source tree, not the wheel, and ci.yml runs it.
          "$py" -m pytest -q -p no:cacheprovider --rootdir="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/python/tests" \
            -k "not test_third_party_licences_name_every_crate_the_extension_links"

  # Publishes only from a v* tag push in cratongen/transiograms: never from a fork, a branch, a
  # pull request or a manual run. The `pypi` environment is a second guard (required reviewer).
  publish:
    name: publish to PyPI
    needs: [sdist, wheels, test-linux, test-other]
    if: >-
      github.repository == 'cratongen/transiograms' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/transiograms
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: The sdist and one wheel per platform tag
        shell: bash
        run: |
          ls -l dist
          sdist=(dist/*.tar.gz); [ "${#sdist[@]}" -eq 1 ]
          whl=(dist/*.whl); [ "${#whl[@]}" -eq 7 ]
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64 musllinux_1_2_x86_64 musllinux_1_2_aarch64 macosx_10_15_x86_64 macosx_11_0_arm64 win_amd64; do
            ls dist/transiograms-*-cp311-abi3-*"$tag"*.whl
          done
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
